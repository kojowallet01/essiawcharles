<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="kelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1716"/>
      <stop offset="50%" stop-color="#0f2622"/>
      <stop offset="100%" stop-color="#071210"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="kelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#kelBg)"/>
  <circle cx="200" cy="180" r="160" fill="#10b981" opacity="0.16" filter="url(#kelGlow)"/>
  <circle cx="1000" cy="400" r="200" fill="#f59e0b" opacity="0.14" filter="url(#kelGlow)"/>

  <!-- Top Navigation Bar -->
  <rect x="50" y="40" width="1100" height="65" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Logo -->
  <circle cx="85" cy="72" r="16" fill="url(#amberGrad)"/>
  <text x="115" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.5">Kelrose Tours &amp; Travel</text>
  
  <!-- Nav links -->
  <text x="450" y="77" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="600">Ghana Destinations</text>
  <text x="630" y="77" fill="#a7f3d0" font-family="sans-serif" font-size="14">Tour Packages</text>
  <text x="770" y="77" fill="#a7f3d0" font-family="sans-serif" font-size="14">Culture &amp; Safari</text>

  <!-- Action button -->
  <rect x="970" y="54" width="155" height="38" rx="8" fill="url(#amberGrad)"/>
  <text x="1005" y="78" fill="#064e3b" font-family="sans-serif" font-size="13" font-weight="800">Book Tour Now ✈</text>

  <!-- Hero Banner -->
  <g transform="translate(50, 130)">
    <rect width="1100" height="200" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="40" y="50" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">DISCOVER THE HEART OF WEST AFRICA</text>
    <text x="40" y="95" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="800">Experience Ghana's Magic &amp; Heritage</text>
    <text x="40" y="130" fill="#94a3b8" font-family="sans-serif" font-size="15">Curated expeditions, historic landmarks, coastal beaches, and wildlife adventures.</text>
    
    <!-- Quick stats in banner -->
    <g transform="translate(720, 35)">
      <rect width="330" height="130" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="25" y="45" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">12+</text>
      <text x="25" y="68" fill="#6ee7b7" font-family="sans-serif" font-size="12">Curated Routes</text>

      <text x="180" y="45" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">100%</text>
      <text x="180" y="68" fill="#fbbf24" font-family="sans-serif" font-size="12">Custom Guides</text>

      <line x1="25" y1="90" x2="305" y2="90" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="25" y="112" fill="#94a3b8" font-family="sans-serif" font-size="12">★ 5.0 Rated Tour Experience by Global Travelers</text>
    </g>
  </g>

  <!-- Destination Cards Row -->
  <g transform="translate(50, 355)">
    <!-- Card 1: Cape Coast -->
    <g transform="translate(0, 0)">
      <rect width="345" height="265" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Image area header -->
      <rect x="0" y="0" width="345" height="135" rx="16" fill="#042f2e"/>
      <text x="25" y="80" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="700">🏰 Cape Coast Castle</text>
      <text x="25" y="105" fill="#a7f3d0" font-family="sans-serif" font-size="13">Central Region • UNESCO Heritage</text>
      
      <!-- Card body -->
      <text x="25" y="170" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Historic Heritage Tour</text>
      <text x="25" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">Walking tour, door of no return, museum guide.</text>
      <text x="25" y="235" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="700">$95 / Person</text>
      <text x="245" y="235" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">Explore →</text>
    </g>

    <!-- Card 2: Kakum Canopy Walk -->
    <g transform="translate(375, 0)">
      <rect width="345" height="265" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="0" y="0" width="345" height="135" rx="16" fill="#064e3b"/>
      <text x="25" y="80" fill="#6ee7b7" font-family="sans-serif" font-size="20" font-weight="700">🌿 Kakum Canopy Walk</text>
      <text x="25" y="105" fill="#a7f3d0" font-family="sans-serif" font-size="13">Rainforest National Park</text>

      <text x="25" y="170" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Canopy Walk &amp; Hiking</text>
      <text x="25" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">350m suspended bridges above tropical forest.</text>
      <text x="25" y="235" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="700">$75 / Person</text>
      <text x="245" y="235" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">Explore →</text>
    </g>

    <!-- Card 3: Mole National Park -->
    <g transform="translate(750, 0)">
      <rect width="350" height="265" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="0" y="0" width="350" height="135" rx="16" fill="#78350f"/>
      <text x="25" y="80" fill="#fcd34d" font-family="sans-serif" font-size="20" font-weight="700">🐘 Mole Wildlife Safari</text>
      <text x="25" y="105" fill="#fed7aa" font-family="sans-serif" font-size="13">Northern Savannah • Elephants</text>

      <text x="25" y="170" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">3-Day Safari Expedition</text>
      <text x="25" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">Jeep safari, eco-lodge stay, local culture.</text>
      <text x="25" y="235" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="700">$220 / Person</text>
      <text x="250" y="235" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">Explore →</text>
    </g>
  </g>
</svg>
