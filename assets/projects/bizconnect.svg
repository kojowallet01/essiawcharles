<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1022"/>
      <stop offset="50%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="bizCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.4)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.0)"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bizBg)"/>
  
  <!-- Subtle ambient light blobs -->
  <circle cx="250" cy="200" r="180" fill="#3b82f6" opacity="0.15" filter="url(#blurGlow)"/>
  <circle cx="950" cy="450" r="220" fill="#6366f1" opacity="0.15" filter="url(#blurGlow)"/>

  <!-- Top App Navigation Bar -->
  <rect x="50" y="40" width="1100" height="65" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Logo -->
  <circle cx="85" cy="72" r="16" fill="url(#blueGlow)"/>
  <text x="115" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">BizConnect Technologies</text>
  
  <!-- Nav links -->
  <text x="420" y="77" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="600">Enterprise Cloud</text>
  <text x="580" y="77" fill="#94a3b8" font-family="sans-serif" font-size="14">Solutions</text>
  <text x="680" y="77" fill="#94a3b8" font-family="sans-serif" font-size="14">Security</text>
  <text x="770" y="77" fill="#94a3b8" font-family="sans-serif" font-size="14">Company</text>

  <!-- Action button -->
  <rect x="980" y="55" width="145" height="36" rx="8" fill="url(#blueGlow)"/>
  <text x="1010" y="78" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Client Portal →</text>

  <!-- Hero Banner Card -->
  <g transform="translate(50, 130)">
    <!-- Main Left Card (Enterprise Overview) -->
    <rect width="660" height="490" rx="18" fill="url(#bizCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="40" y="55" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE CLOUD INFRASTRUCTURE</text>
    <text x="40" y="95" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">Transforming Business Systems</text>
    <text x="40" y="125" fill="#94a3b8" font-family="sans-serif" font-size="15">High-speed deployment, 99.99% uptime SLA, and automated telemetry.</text>

    <!-- Metrics Row -->
    <g transform="translate(40, 155)">
      <!-- Metric 1 -->
      <rect width="170" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="20" y="38" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">99.99%</text>
      <text x="20" y="62" fill="#64748b" font-family="sans-serif" font-size="12">System Uptime</text>

      <!-- Metric 2 -->
      <rect x="190" width="170" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="210" y="38" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="800">&lt; 18ms</text>
      <text x="210" y="62" fill="#64748b" font-family="sans-serif" font-size="12">Global Latency</text>

      <!-- Metric 3 -->
      <rect x="380" width="180" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="400" y="38" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="800">SOC 2</text>
      <text x="400" y="62" fill="#64748b" font-family="sans-serif" font-size="12">Type II Certified</text>
    </g>

    <!-- Chart Visualization -->
    <g transform="translate(40, 265)">
      <rect width="580" height="190" rx="14" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="25" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Network Traffic & Throughput</text>
      <text x="500" y="32" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">+42.8% YoY</text>
      
      <!-- Chart wave path -->
      <path d="M 25 150 C 90 130, 140 160, 200 110 C 260 60, 310 120, 380 75 C 440 35, 500 80, 555 45 L 555 160 L 25 160 Z" fill="url(#chartGrad)"/>
      <path d="M 25 150 C 90 130, 140 160, 200 110 C 260 60, 310 120, 380 75 C 440 35, 500 80, 555 45" fill="none" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Peak Dot -->
      <circle cx="380" cy="75" r="5" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="555" cy="45" r="5" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    </g>
  </g>

  <!-- Right Side Column (Live Cloud Services) -->
  <g transform="translate(735, 130)">
    <!-- Right Card Top -->
    <rect width="415" height="235" rx="18" fill="url(#bizCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="30" y="42" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Active Cloud Clusters</text>
    
    <!-- Service item 1 -->
    <rect x="30" y="65" width="355" height="46" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="55" cy="88" r="6" fill="#10b981"/>
    <text x="75" y="93" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">AWS eu-west-1 (Primary Cluster)</text>
    <text x="325" y="93" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">Healthy</text>

    <!-- Service item 2 -->
    <rect x="30" y="120" width="355" height="46" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="55" cy="143" r="6" fill="#10b981"/>
    <text x="75" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Cloudflare Edge CDN Network</text>
    <text x="325" y="148" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">Active</text>

    <!-- Service item 3 -->
    <rect x="30" y="175" width="355" height="46" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="55" cy="198" r="6" fill="#38bdf8"/>
    <text x="75" y="203" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Postgres Multi-Region Replica</text>
    <text x="320" y="203" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Syncing</text>

    <!-- Right Card Bottom (Client Testimonial snippet) -->
    <g transform="translate(0, 255)">
      <rect width="415" height="235" rx="18" fill="url(#bizCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="30" y="42" fill="#fbbf24" font-family="sans-serif" font-size="14">★★★★★ 5.0 RATED</text>
      <text x="30" y="80" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="600">"BizConnect delivered enterprise-grade</text>
      <text x="30" y="105" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="600">speed, reliability, and precision."</text>
      <text x="30" y="145" fill="#94a3b8" font-family="sans-serif" font-size="13">Built with modern TypeScript, Python microservices,</text>
      <text x="30" y="168" fill="#94a3b8" font-family="sans-serif" font-size="13">and responsive high-performance UI.</text>
      
      <!-- Tag -->
      <rect x="30" y="190" width="130" height="28" rx="6" fill="rgba(59, 130, 246, 0.15)"/>
      <text x="42" y="209" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="600">Corporate Web</text>
    </g>
  </g>
</svg>
